name: Bug Report
description: File a bug report to help us improve the project.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!  
        Please fill in the details below to help us resolve it faster.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-checks
      description: Help us triage faster by confirming the following.
      options:
        - label: I searched existing issues and discussions to avoid duplicates.
          required: true
        - label: I read the documentation and FAQs.
          required: true
        - label: I am using the latest version of the affected package(s).
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package(s)
      options:
        - '@catbee/mysql'
      multiple: true
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: e.g., 0.3.0
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module(s)
      options:
        - 'All Modules'
        - 'SqlClient (Core Client & Query Execution)'
        - 'ConnectionManager (Connection Pooling & Lifecycle)'
        - 'TransactionClient (Transactions & Savepoints)'
        - 'QueryBuilder (Fluent SQL Builder)'
        - 'NamedParameters (Named Parameter Compiler)'
        - 'DateUtils (Date & Time / UTC Handling)'
        - 'Middleware & Events (db.use & EventEmitter)'
        - 'Parameter Validation & Sanitization'
        - 'TypeScript Types'
        - 'Other'
      multiple: true
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, and MySQL / MariaDB server version.
      placeholder: |
        - OS: Ubuntu 22.04 / macOS 14 / Windows 11
        - Node: 20.x / 22.x
        - Database: MySQL 8.0 / MySQL 8.4 / MariaDB 10.11
        - TypeScript: 5.x / 6.x (if applicable)
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Short and clear description of the problem.
      placeholder: e.g., Connection pool leak during transaction rollback or QueryBuilder generates invalid WHERE clause.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Include code snippets, commands, or repo links.
      placeholder: |
        1. Initialize SqlClient with pool options ...
        2. Execute query / transaction ...
        3. See error ...
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Link to a GitHub repository, Gist, or minimal reproducible script.
      placeholder: https://github.com/... or https://gist.github.com/...
    validations:
      required: false

  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - 'Yes'
        - 'No'
        - 'Unsure'
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocks usage)
        - Major (significant impact)
        - Minor (workaround exists)
        - Trivial (cosmetic)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe what actually happened. Include errors/logs.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & SQL
      description: Paste error logs, stack traces, MySQL error codes, or executed SQL queries. Wrap in triple backticks.
      placeholder: |
        ```
        <paste logs, SQL queries, or MySQL errors here>
        ```
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      placeholder: Schema/DDL snippets, screenshots, related issues, or anything else useful.
